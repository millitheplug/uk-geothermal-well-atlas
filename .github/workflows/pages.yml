name: Deploy well map to GitHub Pages

# Publishes the static map of real NSTA well records (site/ plus the committed
# data snapshot). The full assessment platform needs a Python backend and a
# database, which GitHub Pages cannot run, so it is not deployed here.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/real/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the data snapshot
        working-directory: data/real/nsta
        run: sha256sum -c nsta_onshore_wells_wgs84.geojson.sha256

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp data/real/nsta/nsta_onshore_wells_wgs84.geojson _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
