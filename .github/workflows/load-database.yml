name: Load database

# Run manually from the Actions tab. Applies the schema to the hosted Postgres,
# loads the 2,138 real NSTA wells, creates the login and runs assessments.
# Safe to re-run: the migration and well import are idempotent. Re-runs can
# skip the slow import with load_wells off.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL    connection string from Neon, pasted exactly as shown
#   ADMIN_EMAIL     email to log in with
#   ADMIN_PASSWORD  password to log in with (use a long one)

on:
  workflow_dispatch:
    inputs:
      load_wells:
        description: "Import the 2,138 NSTA wells (about 20 minutes over a remote database; skip if already loaded)"
        type: boolean
        default: true
      assess:
        description: "Which wells to run feasibility assessments on"
        type: choice
        options:
          - with_temperature
          - none
          - all
        default: with_temperature
      include_synthetic:
        description: "Also load the 20 synthetic demo wells (kept separate, flagged as synthetic)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    # Every database round trip crosses the internet, so imports and full
    # assessments are far slower here than on a laptop (about 20 minutes for the
    # wells, about 1.5 hours to assess all of them).
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          for name in DATABASE_URL ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          if [ "${#ADMIN_PASSWORD}" -lt 12 ]; then
            echo "::error::ADMIN_PASSWORD must be at least 12 characters."
            exit 1
          fi

      - name: Verify the data snapshot
        working-directory: data/real/nsta
        run: sha256sum -c nsta_onshore_wells_wgs84.geojson.sha256

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e backend

      - name: Apply schema
        run: python -m scripts.cli init --migrate

      - name: Load real NSTA wells
        if: ${{ inputs.load_wells }}
        run: python -m scripts.cli ingest nsta_wells

      - name: Load synthetic demo data
        if: ${{ inputs.include_synthetic }}
        run: python -m scripts.cli bootstrap

      - name: Create login
        run: python -m scripts.cli seed-user --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD"

      # "with_temperature" covers the wells where thermal potential is known.
      # Wells with no recorded temperature have unknown potential and can be
      # assessed one at a time in the app, or with assess: all.
      - name: Run assessments
        if: ${{ inputs.assess != 'none' }}
        run: |
          if [ "${{ inputs.assess }}" = "with_temperature" ]; then
            python -m scripts.cli assess --email "$ADMIN_EMAIL" --exclude-mock --min-temperature 1 --limit 5000
          else
            python -m scripts.cli assess --email "$ADMIN_EMAIL" --exclude-mock --limit 5000
          fi
