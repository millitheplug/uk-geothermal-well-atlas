# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# Render asks for the two values marked "sync: false"; everything else is set.
services:
  - type: web
    name: uk-geothermal-atlas-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness, not readiness. `/api/v1/admin/health` queries the database, so
    # using it here makes any database problem fail the whole deploy even though
    # the process is up - and app/main.py asks for the two to be wired
    # separately for exactly that reason. Readiness stays available to anyone
    # who wants to probe it deliberately.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      # The app refuses to start in production with DEBUG on or the dev secret.
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Comma-separated list of frontend origins allowed to call this API.
      - key: CORS_ORIGINS
        sync: false
